name: Capsule Clash Build
on: workflow_dispatch

jobs:
  build:
    runs-on: [self-hosted, unity_windows]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.RUNNER_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: CIBuild.BuildWindows
          buildPath: build/Client

      # - uses: game-ci/unity-builder@v4
      #   env:
      #     UNITY_LICENSE: ${{ secrets.RUNNER_LICENSE }}
      #     UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      #     UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      #   with:
      #     targetPlatform: StandaloneWindows64
      #     customParameters: -standaloneBuildSubtarget Server
      #     buildMethod: CIBuild.BuildWindows
      #     buildPath: build/Server

      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: build/Client

      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: server
      #     path: build/Server
